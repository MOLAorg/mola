name: Create GitHub release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  github-release:
    name: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Pinned revision (v4.4.0); this job has "contents: write" permissions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check that all version numbers agree with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release.py check | grep -q ": ${VERSION}$" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match the version in the sources:"; \
                 python3 scripts/release.py check; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          python3 scripts/release.py notes --version "${VERSION}" > /tmp/notes.md \
            || echo "No changelog entry found for this version. See the commit history for details." > /tmp/notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${REPO_NAME} ${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${REPO_NAME} ${VERSION}" --notes-file /tmp/notes.md
          fi

# Builds the documentation and fails on structural breakage in hand-written
# pages: a missing include, a dangling reference, an unreachable page.
#
# The Sphinx project lives here in mola/docs, but roughly half of its pages are
# .. include::d from sibling repositories by relative path, so this workflow
# reconstructs the same directory layout the docs host uses. Those sibling
# repositories call this workflow via workflow_call so that a pull request
# against any of them is checked against the real doc set.
name: Check docs

on:
  push:
    branches: [develop, master]
  pull_request:
  # Sibling repositories call this so their own pull requests are validated
  # against the real doc set. A reusable workflow runs in the caller's context,
  # so github.repository and github.sha already point at the code under test.
  workflow_call:

# Sphinx executes conf.py from the code under test, so this job runs
# pull-request-controlled Python. Give its token nothing but read access.
permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mola
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: MOLAorg/mola
          path: src/mola

      # The sibling checkouts must sit next to mola: the .rst stubs in
      # mola/docs/source reach them as ../../../<repo>/docs/...
      - name: Check out mp2p_icp
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: MOLAorg/mp2p_icp
          path: src/mp2p_icp

      - name: Check out mola_lidar_odometry
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: MOLAorg/mola_lidar_odometry
          path: src/mola_lidar_odometry

      - name: Check out mola_mapper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: MOLAorg/mola_mapper
          path: src/mola_mapper

      - name: Check out mola_state_estimation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: MOLAorg/mola_state_estimation
          path: src/mola_state_estimation

      # Overwrite whichever checkout above corresponds to the repository whose
      # pull request triggered this run, so the doc set is built against the
      # proposed changes rather than that repository's default branch.
      - name: Check out the code under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: src/${{ github.event.repository.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sphinx and friends
        working-directory: src/mola/docs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the hand-written docs
        working-directory: src/mola/docs
        env:
          # conf.py unconditionally loads the doxyrest extensions; CI builds
          # without doxygen, so satisfy the import with no-op modules.
          PYTHONPATH: ci/doxyrest_shim
        run: |
          # index.rst puts the generated API index in a toctree. Without
          # doxyrest that document does not exist, which would look exactly
          # like the breakage this job is meant to catch, so stub it.
          printf 'C++ API\n=======\n\nGenerated by doxyrest; not built in CI.\n' \
            > source/doxygen-index.rst
          sphinx-build -b html source/ html/ 2>&1 | tee sphinx.log

      - name: Check for breakage in hand-written pages
        working-directory: src/mola/docs
        run: ci/check-docs-warnings.sh sphinx.log

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-log
          path: src/mola/docs/sphinx.log
          if-no-files-found: ignore

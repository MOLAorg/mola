name: CI clang-format

on: [push, pull_request]

jobs:
  clang-format-check:
    name: clang-format-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Git submodules
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ubuntu-latest no longer ships clang-format-14: take it from PyPI, under
      # the name the formatter script looks for.
      - name: Install clang-format-14
        run: |
          pip install clang-format==14.0.6
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v clang-format)" "$HOME/bin/clang-format-14"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/clang-format-14" --version

      - name: Check code style
        run: bash scripts/formatter.sh --check

